# this_file: .github/workflows/release.yml

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  build-and-publish:
    name: Build and Publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/font-organizer
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install UV
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          python-version: "3.12"
          enable-cache: true

      - name: Install build tools
        run: uv pip install build hatchling hatch-vcs

      - name: Build distributions
        run: uv run python -m build --outdir dist

      - name: Verify distribution files
        run: |
          ls -la dist/
          test -n "$(find dist -name '*.whl')" || (echo "Wheel file missing" && exit 1)
          test -n "$(find dist -name '*.tar.gz')" || (echo "Source distribution missing" && exit 1)

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}

      - name: Upload Python packages to release
        uses: actions/upload-artifact@v4
        with:
          name: python-packages
          path: dist/

  build-binaries:
    name: Build Release Binaries
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12"]
      fail-fast: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install UV
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: |
          uv pip install --system --upgrade pip
          uv pip install --system ".[binary]"

      - name: Build binary (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          chmod +x scripts/build-binary.sh
          ./scripts/build-binary.sh --onefile

      - name: Build binary (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m PyInstaller --onefile --name font-organizer --distpath dist-binary --workpath build-binary --specpath build-binary src/font_organizer/cli.py

      - name: Rename binary for release
        run: |
          mkdir -p release-binaries
          if [ "$RUNNER_OS" == "Linux" ]; then
            cp dist-binary/font-organizer release-binaries/font-organizer-linux-x64
          elif [ "$RUNNER_OS" == "Windows" ]; then
            cp dist-binary/font-organizer.exe release-binaries/font-organizer-windows-x64.exe
          elif [ "$RUNNER_OS" == "macOS" ]; then
            cp dist-binary/font-organizer release-binaries/font-organizer-macos-x64
          fi
        shell: bash

      - name: Upload binary artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-binary-${{ matrix.os }}
          path: release-binaries/

  create-release:
    name: Create GitHub Release
    needs: [build-and-publish, build-binaries]
    runs-on: ubuntu-latest
    steps:
      - name: Download Python packages
        uses: actions/download-artifact@v4
        with:
          name: python-packages
          path: dist/

      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-binary-*
          path: binaries/
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/*
            binaries/*
          generate_release_notes: true
          body: |
            ## Installation
            
            ### Python Package
            ```bash
            pip install font-organizer
            ```
            
            ### Binary Downloads
            - **Linux**: `font-organizer-linux-x64`
            - **Windows**: `font-organizer-windows-x64.exe`
            - **macOS**: `font-organizer-macos-x64`
            
            Make the binary executable on Unix systems:
            ```bash
            chmod +x font-organizer-linux-x64  # or font-organizer-macos-x64
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 