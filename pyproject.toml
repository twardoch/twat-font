# this_file: pyproject.toml
# this_project: font_organizer

# Build System Configuration
# -------------------------
# Specifies the build system and its requirements for packaging the project
# Specifies the build backend and its requirements for building the package
[build-system]
requires = [
    "hatchling>=1.27.0",     # Core build backend for Hatch
    "hatch-vcs>=0.4.0",      # Version Control System plugin for Hatch
]
build-backend = "hatchling.build"  # Use Hatchling as the build backend

# Wheel build configuration
# Specifies which packages to include in the wheel distribution
[tool.hatch.build.targets.wheel]
packages = ["src/font_organizer"]

# Project Metadata Configuration
# ------------------------------
# Comprehensive project description, requirements, and compatibility information
[project]
name = "twat-font"
dynamic = ["version"]  # Version is determined dynamically from VCS
description = "Modern font organization tool for managing and curating font collections"
readme = "README.md"
requires-python = ">=3.12"  # Minimum Python version required
license = "MIT"
keywords = ["fonts", "typography", "organization", "fonttools", "subsetting"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]

# Runtime Dependencies
# -------------------
# External packages required for the project to function
dependencies = [
    "click>=8.0.0",  # For CLI interface
    "rich>=13.10.6",  # Rich terminal output
    "fire>=0.7.3",  # CLI framework
    "fonttools>=4.55.5",  # Font manipulation
    "loguru>=0.7.3",  # Advanced logging
    "pathlib>=1.0.1",  # Path operations
    "typing-extensions>=4.12.2",  # Type hints
    "pyyaml>=6.0.1",  # YAML configuration support
]


[[project.authors]]
name = "Adam Twardoch"
email = "adam+github@twardoch.com"


[project.urls]
Documentation = "https://github.com/twardoch/font_organizer#readme"
Issues = "https://github.com/twardoch/font_organizer/issues"
Source = "https://github.com/twardoch/font_organizer"

[project.scripts]
font-organizer = "font_organizer.cli:main"




[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
version_scheme = "post-release"

[tool.hatch.build.hooks.vcs]
version-file = "src/twat_font/__version__.py"



[tool.hatch.envs.default]
dependencies = [
    "pytest",
    "pytest-cov",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
    "uv>=0.1.17", # Added uv
]


[tool.hatch.envs.default.scripts]
# Ensure uv is used for running tools if they are managed by hatch's environment
# Or explicitly use 'uv run' for tools that might not be directly on PATH from hatch env
test = "uv run pytest {args:tests}"
test-cov = "uv run pytest --cov-report=term-missing --cov-config=pyproject.toml --cov=src/font_organizer --cov=tests {args:tests}"
type-check = "uv run mypy src/font_organizer tests"
# For linting, ruff is typically installed into the environment by Hatch.
# If Hatch places binaries in a way that `uv run` is beneficial, use it. Otherwise, direct call is fine.
# Assuming direct call is fine after Hatch setup for these.
lint = ["uv run ruff check src/font_organizer tests", "uv run ruff format --check src/font_organizer tests"]
format = "uv run ruff format src/font_organizer tests" # Added explicit format script
# Script to install/update tools using uv
tools-install = "uv pip install --upgrade pytest pytest-cov mypy ruff"


[[tool.hatch.envs.all.matrix]]
python = ["3.10", "3.11", "3.12"]


[tool.hatch.envs.lint]
detached = true
dependencies = [
    "mypy>=1.0.0",
    "ruff>=0.1.0",
    "uv>=0.1.17", # Added uv
]


[tool.hatch.envs.lint.scripts]
typing = "uv run mypy --install-types --non-interactive {args:src/font_organizer tests}"
style = ["uv run ruff check {args:.}", "uv run ruff format --check {args:.}"] # Added --check
fmt = ["uv run ruff format {args:.}", "uv run ruff check --fix {args:.}"]
all = ["style", "typing"]
# Script to install/update linting tools using uv
tools-install-lint = "uv pip install --upgrade mypy ruff"


[tool.ruff]
target-version = "py310"
line-length = 120
[tool.ruff.lint]
select = [
    "A",
    "ARG",
    "B",
    "C",
    "DTZ",
    "E",
    "EM",
    "F",
    "FBT",
    "I",
    "ICN",
    "ISC",
    "N",
    "PLC",
    "PLE",
    "PLR",
    "PLW",
    "Q",
    "RUF",
    "S",
    "T",
    "TID",
    "UP",
    "W",
    "YTT",
]
ignore = [
    "ARG001",
    "ARG002",
    "ARG004",
    "ARG005",
    "B904",
    "C901",
    "DTZ005",
    "E501",
    "F401",
    "F811",
    "FBT001",
    "FBT002",
    "FBT003",
    "I001",
    "ISC001",
    "N803",
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR2004",
    "S311",
    "S603",
    "S607",
    "T201",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true


[tool.coverage.run]
source_pkgs = ["font_organizer", "tests"]
branch = true
parallel = true
omit = [
    "src/font_organizer/__about__.py",
]


[tool.coverage.paths]
font_organizer = ["src/font_organizer", "*/font-organizer/src/font_organizer"]
tests = ["tests", "*/font-organizer/tests"]


[tool.coverage.report]
exclude_lines = [
    "no cov",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.5.0",  # For parallel test execution
    "pytest-benchmark[histogram]>=4.0.0",  # For performance testing
]

dev = [
    "pre-commit>=3.6.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.5.56",
    "mkdocstrings[python]>=0.28.0",
    "pymdown-extensions>=10.14",
]

build = [
    "build>=0.10.0",
    "hatchling>=1.27.0",
    "hatch-vcs>=0.4.0",
    "twine>=4.0.0",
]

binary = [
    "pyinstaller>=6.0.0",
    "cx-freeze>=6.15.0",
]

all = ["test", "dev", "docs", "build", "binary"]

[tool.hatch.envs.test]
dependencies = [".[test]"]

[tool.hatch.envs.test.scripts]
# Use uv run for consistency, though python -m pytest is also fine as pytest is a dependency.
test = "uv run pytest -n auto {args:tests}"
test-cov = "uv run pytest -n auto --cov-report=term-missing --cov-config=pyproject.toml --cov=src/font_organizer --cov=tests {args:tests}"
bench = "uv run pytest -v -p no:briefcase tests/test_benchmark.py --benchmark-only {args}"
bench-save = "uv run pytest -v -p no:briefcase tests/test_benchmark.py --benchmark-only --benchmark-json=benchmark/results.json {args}"

[tool.pytest.ini_options]
markers = [
    "benchmark: marks tests as benchmarks (select with '-m benchmark')",
    "unit: mark a test as a unit test",
    "integration: mark a test as an integration test",
    "slow: marks tests as slow (select with '-m slow')",
    "online: marks tests that require internet access",
    "requires_api_key: marks tests that require API keys",
]
addopts = "-v -p no:briefcase"
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
asyncio_mode = "auto"

[tool.pytest-benchmark]
min_rounds = 100
min_time = 0.1
histogram = true
storage = "file"
save-data = true
compare = [
    "min",    # Minimum time
    "max",    # Maximum time
    "mean",   # Mean time
    "stddev", # Standard deviation
    "median", # Median time
    "iqr",    # Inter-quartile range
    "ops",    # Operations per second
    "rounds", # Number of rounds
]
